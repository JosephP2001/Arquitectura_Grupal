version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: medical_postgres
    environment:
      POSTGRES_USER: medical_user
      POSTGRES_PASSWORD: medical_pass
      POSTGRES_DB: medical_appointments
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - medical_network

  mongodb:
    image: mongo:7
    container_name: medical_mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongo_user
      MONGO_INITDB_ROOT_PASSWORD: mongo_pass
      MONGO_INITDB_DATABASE: medical_records
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - medical_network

  redis:
    image: redis:7-alpine
    container_name: medical_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - medical_network
    command: redis-server --appendonly yes

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medical_backend
    environment:
      DATABASE_URL: postgresql://medical_user:medical_pass@postgres:5432/medical_appointments
      MONGODB_URL: mongodb://mongo_user:mongo_pass@mongodb:27017/
      REDIS_URL: redis://redis:6379/0
      SESSION_EXPIRE_MINUTES: 60
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - mongodb
      - redis
    volumes:
      - ./backend:/app
    networks:
      - medical_network
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: medical_frontend
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - medical_network
    command: npm run dev -- --host

volumes:
  postgres_data:
  mongo_data:
  redis_data:

networks:
  medical_network:
    driver: bridge
